<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saddle Cafe — Menú</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F7F3EC;
    --tan: #E8DFD0;
    --saddle: #8B5E3C;
    --saddle-dark: #5C3A1E;
    --saddle-light: #C49A6C;
    --green: #4A6741;
    --text: #2C1F14;
    --text-muted: #7A6552;
    --white: #FFFFFF;
  }

  body {
    background: linear-gradient(135deg, #F7F3EC 0%, #E8DFD0 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 160px;
  }

  header {
    background: linear-gradient(135deg, #5C3A1E 0%, #3d2714 100%);
    color: #F0E6D3;
    padding: 30px 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 600;
    margin: 10px 0 5px;
  }

  header p {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--saddle-light);
  }

  .table-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--saddle-light) 0%, #a87d4f 100%);
    color: #5C3A1E;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 25px;
    margin-top: 12px;
    box-shadow: 0 2px 8px rgba(139, 94, 60, 0.3);
  }

  .table-selector-container {
    padding: 20px 20px 24px;
    background: rgba(255, 255, 255, 0.5);
    border-bottom: 1px solid rgba(139, 94, 60, 0.2);
  }

  .table-prompt {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .table-selector {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .table-chip {
    padding: 8px 18px;
    border: 2px solid var(--saddle-light);
    border-radius: 25px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--saddle);
    background: transparent;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .table-chip.active {
    background: var(--saddle);
    color: #F0E6D3;
    border-color: var(--saddle);
    box-shadow: 0 4px 12px rgba(139, 94, 60, 0.3);
  }

  .section-label {
    padding: 24px 20px 12px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--saddle);
    font-weight: 600;
  }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(139, 94, 60, 0.1);
    gap: 12px;
    background: rgba(255, 255, 255, 0.4);
    transition: all 0.2s;
  }

  .menu-item:hover {
    background: rgba(255, 255, 255, 0.7);
  }

  .item-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .item-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .item-price {
    font-size: 17px;
    font-weight: 700;
    color: var(--saddle-dark);
    min-width: 50px;
    text-align: right;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .qty-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--saddle);
    background: var(--cream);
    color: var(--saddle);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-weight: 600;
  }

  .qty-btn:active { 
    background: var(--saddle); 
    color: var(--cream);
    transform: scale(0.9);
  }

  .qty-num {
    font-size: 16px;
    font-weight: 700;
    min-width: 20px;
    text-align: center;
    color: var(--text);
  }

  .flavor-select {
    display: none;
    padding: 0 20px 12px;
    margin-top: 8px;
  }

  .flavor-select select {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--saddle-light);
    border-radius: 8px;
    background: white;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  .flavor-select.visible { display: block; }

  .cart-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, white 0%, #f9f7f4 100%);
    border-top: 2px solid var(--saddle-light);
    padding: 16px 20px 24px;
    z-index: 200;
    box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
  }

  .cart-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .cart-count {
    font-size: 14px;
    color: var(--text-muted);
  }

  .cart-total {
    font-size: 20px;
    font-weight: 700;
    color: var(--saddle-dark);
  }

  .order-btn {
    width: 100%;
    background: linear-gradient(135deg, #5C3A1E 0%, #3d2714 100%);
    color: #F0E6D3;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(92, 58, 30, 0.3);
  }

  .order-btn:hover {
    box-shadow: 0 6px 18px rgba(92, 58, 30, 0.4);
    transform: translateY(-2px);
  }

  .order-btn:active {
    transform: scale(0.98);
  }

  .order-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .success-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(92, 58, 30, 0.9);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }

  .success-overlay.show { display: flex; }

  .success-card {
    background: var(--cream);
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    border: 2px solid var(--saddle-light);
  }

  .success-icon { font-size: 64px; margin-bottom: 16px; }

  .success-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--saddle-dark);
    margin-bottom: 10px;
  }

  .success-card p {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.8;
  }

  .success-card button {
    margin-top: 24px;
    background: linear-gradient(135deg, #5C3A1E 0%, #3d2714 100%);
    color: #F0E6D3;
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }

  .success-card button:hover {
    transform: translateY(-2px);
  }

  .connection-banner {
    display: none;
    background: #c0392b;
    color: white;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
  }

  .connection-banner.show { display: block; }

  .hidden { display: none; }

  @media (max-width: 600px) {
    header h1 { font-size: 26px; }
    .order-btn { font-size: 15px; padding: 14px; }
  }
</style>
</head>
<body>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzP41R5gvKoQ-OjCTVA41MoJqMQ9ZOhGY",
    authDomain: "saddle-cafe-hmo.firebaseapp.com",
    databaseURL: "https://saddle-cafe-hmo-default-rtdb.firebaseio.com",
    projectId: "saddle-cafe-hmo",
    storageBucket: "saddle-cafe-hmo.firebasestorage.app",
    messagingSenderId: "655577684903",
    appId: "1:655577684903:web:65fc7f3240e4a85604b482",
    measurementId: "G-6SGT3KLSN4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window._enviarPedidoFirebase = async function(order) {
    const ordersRef = ref(db, 'pedidos');
    await push(ordersRef, { ...order, timestamp: serverTimestamp() });
  };

  window._firebaseReady = true;
</script>

<div class="connection-banner" id="connBanner">
  ⚠️ Sin conexión — revisa tu internet e intenta de nuevo
</div>

<header>
  <span style="font-size:48px; display:block; margin-bottom:10px;">🐴</span>
  <h1>Saddle Cafe</h1>
  <p>by Club Hípico Sonora</p>
  <span class="table-badge" id="headerTableBadge">Selecciona tu mesa</span>
</header>

<div class="table-selector-container" id="tableSelectorContainer">
  <p class="table-prompt">¿En qué mesa estás?</p>
  <div class="table-selector">
    <button class="table-chip" onclick="selectTable(1)">Mesa 1</button>
    <button class="table-chip" onclick="selectTable(2)">Mesa 2</button>
    <button class="table-chip" onclick="selectTable(3)">Mesa 3</button>
    <button class="table-chip" onclick="selectTable(4)">Mesa 4</button>
    <button class="table-chip" onclick="selectTable(5)">Mesa 5</button>
    <button class="table-chip" onclick="selectTable(6)">Mesa 6</button>
    <button class="table-chip" onclick="selectTable(7)">Mesa 7</button>
    <button class="table-chip" onclick="selectTable(8)">Mesa 8</button>
  </div>
</div>

<div id="menuContainer"></div>

<div class="cart-bar">
  <div class="cart-summary">
    <span class="cart-count" id="cartCount">0 artículos</span>
    <span class="cart-total" id="cartTotal">$0.00</span>
  </div>
  <button class="order-btn" id="orderBtn" onclick="placeOrder()" disabled>
    Enviar pedido a la barra
  </button>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <span class="success-icon">✅</span>
    <h2>¡Pedido enviado!</h2>
    <p>Tu orden ya está en camino a la barra.<br>En unos minutos tendrás tus bebidas listas.</p>
    <button onclick="closeSuccess()">Hacer otro pedido</button>
  </div>
</div>

<script>
const MENU = [
  { category: "Hot Coffee ☕", items: [
    { id: "esp", name: "Espresso", price: 45 },
    { id: "ame", name: "Americano", price: 50 },
    { id: "cap", name: "Cappuccino", price: 60 },
    { id: "lat", name: "Latte", price: 65 },
    { id: "latsab", name: "Latte Sabor", price: 70, flavors: ["Vainilla", "Caramelo", "Mocha"], flavorLabel: "Elige sabor" },
  ]},
  { category: "Iced Coffee 🧊", items: [
    { id: "iame", name: "Iced Americano", price: 50 },
    { id: "ilat", name: "Iced Latte", price: 70 },
    { id: "ilatsab", name: "Iced Latte Sabor", price: 75, flavors: ["Vainilla", "Caramelo", "Mocha"], flavorLabel: "Elige sabor" },
  ]},
  { category: "Frappes 🥤", items: [
    { id: "fra", name: "Frappe", price: 70, flavors: ["Chai", "Café", "Matcha"], flavorLabel: "Elige sabor" },
  ]},
  { category: "Tea & Drinks 🍵", items: [
    { id: "cha", name: "Chai Latte", price: 65 },
    { id: "mat", name: "Matcha Latte", price: 70 },
    { id: "choc", name: "Hot Chocolate", price: 50 },
  ]},
  { category: "Refreshers 🌿", items: [
    { id: "str", name: "Strawberry Ride", price: 75 },
    { id: "pea", name: "Peach Tea Pony", price: 75 },
    { id: "ras", name: "Raspberry Trot", price: 75 },
  ]},
  { category: "Signature Drinks ⭐", items: [
    { id: "sun", name: "Sunset Rider", price: 85, sub: "Naranja, tónica y shot de espresso" },
    { id: "mar", name: "Marwari Chai", price: 85, sub: "Chai con caramelo y shot de espresso" },
    { id: "zai", name: "Zaino Mocha", price: 85, sub: "Mocha frappe con Oreo" },
  ]},
  { category: "Postres 🍰", items: [
    { id: "pos", name: "Repostería del día", price: 45 },
  ]},
];

let cart = {};
let selectedTable = null;
let flavors = {};

function initTableFromURL() {
  const params = new URLSearchParams(window.location.search);
  const mesaParam = params.get('mesa');
  if (mesaParam) {
    const tableNum = parseInt(mesaParam);
    if (tableNum >= 1 && tableNum <= 8) {
      selectTable(tableNum);
      document.getElementById('tableSelectorContainer').classList.add('hidden');
    }
  }
}

function selectTable(n) {
  selectedTable = n;
  document.getElementById('headerTableBadge').textContent = 'Mesa ' + n;
  document.querySelectorAll('.table-chip').forEach((c, i) => {
    c.classList.toggle('active', i + 1 === n);
  });
  updateCartUI();
}

function buildMenu() {
  const container = document.getElementById('menuContainer');
  container.innerHTML = '';

  MENU.forEach((cat, ci) => {
    if (ci > 0) {
      const spacer = document.createElement('div');
      spacer.style.height = '2px';
      spacer.style.background = 'linear-gradient(90deg, transparent, #C49A6C, transparent)';
      spacer.style.margin = '16px 0';
      container.appendChild(spacer);
    }

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = cat.category;
    container.appendChild(label);

    cat.items.forEach(item => {
      const wrapper = document.createElement('div');

      const row = document.createElement('div');
      row.className = 'menu-item';
      row.style.display = 'flex';
      row.style.alignItems = 'flex-start';
      row.style.justifyContent = 'space-between';

      const info = document.createElement('div');
      info.style.flex = '1';

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.name;
      info.appendChild(name);

      if (item.sub) {
        const sub = document.createElement('div');
        sub.className = 'item-sub';
        sub.textContent = item.sub;
        info.appendChild(sub);
      }

      const right = document.createElement('div');
      right.style.display = 'flex';
      right.style.alignItems = 'center';
      right.style.gap = '12px';
      right.style.flexShrink = '0';

      const price = document.createElement('div');
      price.className = 'item-price';
      price.textContent = '$' + item.price;

      const qty = document.createElement('div');
      qty.className = 'qty-control';
      qty.innerHTML = `
        <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
        <span class="qty-num" id="qty_${item.id}">0</span>
        <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
      `;

      right.appendChild(price);
      right.appendChild(qty);
      row.appendChild(info);
      row.appendChild(right);
      wrapper.appendChild(row);

      if (item.flavors) {
        const flavorDiv = document.createElement('div');
        flavorDiv.className = 'flavor-select';
        flavorDiv.id = 'flavor_' + item.id;
        flavorDiv.innerHTML = `<select onchange="setFlavor('${item.id}', this.value)">
          <option value="">— ${item.flavorLabel} —</option>
          ${item.flavors.map(f => `<option value="${f}">${f}</option>`).join('')}
        </select>`;
        wrapper.appendChild(flavorDiv);
      }

      container.appendChild(wrapper);
    });
  });
}

function changeQty(id, delta) {
  const current = cart[id]?.qty || 0;
  const next = Math.max(0, current + delta);
  if (next === 0) {
    delete cart[id];
  } else {
    const item = MENU.flatMap(cat => cat.items).find(i => i.id === id);
    if (!cart[id]) cart[id] = { name: item.name, price: item.price, qty: 0 };
    cart[id].qty = next;
    if (item.flavors && next > 0) {
      document.getElementById('flavor_' + id).classList.add('visible');
    }
  }
  if (next === 0 && document.getElementById('flavor_' + id)) {
    document.getElementById('flavor_' + id).classList.remove('visible');
    delete flavors[id];
  }
  document.getElementById('qty_' + id).textContent = next;
  updateCartUI();
}

function setFlavor(id, val) {
  flavors[id] = val;
}

function updateCartUI() {
  let total = 0, count = 0;
  for (const id in cart) {
    total += cart[id].price * cart[id].qty;
    count += cart[id].qty;
  }
  document.getElementById('cartCount').textContent = count + (count === 1 ? ' artículo' : ' artículos');
  document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
  const btn = document.getElementById('orderBtn');
  btn.disabled = count === 0 || !selectedTable;
  if (!selectedTable && count > 0) {
    btn.textContent = 'Selecciona tu mesa primero';
  } else if (count === 0) {
    btn.textContent = 'Enviar pedido a la barra';
  } else {
    btn.textContent = `Enviar pedido — $${total.toFixed(2)}`;
  }
}

async function placeOrder() {
  if (!selectedTable) return;

  const items = [];
  for (const id in cart) {
    const entry = { ...cart[id] };
    if (flavors[id]) entry.flavor = flavors[id];
    items.push(entry);
  }

  const order = {
    table: selectedTable,
    items,
    time: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }),
    status: 'pendiente'
  };

  const btn = document.getElementById('orderBtn');
  btn.textContent = 'Enviando...';
  btn.disabled = true;

  try {
    await window._enviarPedidoFirebase(order);
    cart = {};
    flavors = {};
    document.querySelectorAll('.qty-num').forEach(el => el.textContent = '0');
    document.querySelectorAll('.flavor-select').forEach(el => el.classList.remove('visible'));
    updateCartUI();
    document.getElementById('successOverlay').classList.add('show');
  } catch (err) {
    alert('Error al enviar. Revisa la conexión.');
    btn.textContent = 'Enviar pedido a la barra';
    btn.disabled = false;
  }
}

function closeSuccess() {
  document.getElementById('successOverlay').classList.remove('show');
}

initTableFromURL();
buildMenu();
updateCartUI();
</script>
</body>
</html>
